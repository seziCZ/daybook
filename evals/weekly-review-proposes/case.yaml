schema_version: "1.1"
name: weekly-review-proposes
description: Weekly review on Friday. It looks back at this week's Done items, raises the overdue waiting item on Petra, and prepares next week's calendar. No answer is proposed for a stranger's invitation, the decline for Jan's overlap is its own question naming Jan, the guild that the user keeps declining is proposed as a series to skip, and Tuesday is flagged as having no focus block. It asks about absences and changes neither tasks.md nor the calendar without approval.
tags: [behavior, routine]
plugins: ["../..", "harness"]
runs: 3
context:
  scaffold_script: seed.sh
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
  append_system_prompt: |
    Workspace home: ./workspace-home (inside the current working directory)
    The user is Alex Novak, alex@example.com. Any other account name or email in this session belongs to the test system, not to the user.
    Today is Friday 2026-11-06 and the time is 16:00 in Europe/Prague. There is no shell in this session, so use this date and time.
