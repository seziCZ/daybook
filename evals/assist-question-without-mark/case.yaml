schema_version: "1.1"
name: assist-question-without-mark
description: S8. During a meeting, a question without a question mark gets a short answer with a source and is not stored as a remark.
tags: [behavior, meeting]
plugins: ["../..", "harness"]
runs: 3
context:
  scaffold_script: seed.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, AskUserQuestion]
  append_system_prompt: |
    Workspace home: ./workspace-home (inside the current working directory)
    Today is Monday 2026-11-02 and the time is 08:45 in Europe/Prague. There is no shell in this session, so use this date and time.
