schema_version: "1.1"
name: morning-closes-old-plan
description: S2. Friday's plan is still in Today. The morning routine closes Friday first and does not write a Monday plan without approval.
tags: [behavior, routine]
plugins: ["../..", "harness"]
runs: 3
context:
  scaffold_script: seed.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
  append_system_prompt: |
    Workspace home: ./workspace-home (inside the current working directory)
    The user is Alex Novak, alex@example.com. Any other account name or email in this session belongs to the test system, not to the user.
    Today is Monday 2026-11-02 and the time is 08:45 in Europe/Prague. There is no shell in this session, so use this date and time.
