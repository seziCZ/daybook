name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the repository
        run: python -I -B scripts/lint.py

      - name: Validate every skill against the Agent Skills specification
        run: |
          pip install skills-ref==0.1.1
          for d in skills/*/; do agentskills validate "$d"; done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate the plugin and the marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
